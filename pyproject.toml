[project]
name = "basic-harness-2"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.6",
    "gudhi>=3.10",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-dateutil>=2.8",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "pydantic-monty>=0.1.0",
    "redis[hiredis]>=5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
